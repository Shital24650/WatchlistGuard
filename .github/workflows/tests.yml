name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py main.py watchlistguard tests
      - name: Run complete test suite
        run: python -m unittest discover -v
      - name: Run authentication and authorization security suite
        run: python -m unittest tests.test_security -v
      - name: Run Bandit security checks
        run: bandit -q -r app.py main.py watchlistguard
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Validate OpenAPI contract
        run: python -c "from app import app; from openapi_spec_validator import validate; validate(app.test_client().get('/api/openapi.json').get_json())"
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: watchlistguard
          POSTGRES_PASSWORD: watchlistguard
          POSTGRES_DB: watchlistguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchlistguard -d watchlistguard_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://watchlistguard:watchlistguard@localhost:5432/watchlistguard_test
      WATCHLISTGUARD_DATABASE_URL: postgresql://watchlistguard:watchlistguard@localhost:5432/watchlistguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base && alembic upgrade head
      - run: python -m compileall -q app.py main.py watchlistguard tests migrations
      - run: python -m unittest tests.test_postgres_integration tests.test_security_postgres -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag watchlistguard:ci .
