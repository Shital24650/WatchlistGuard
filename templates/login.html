<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · WatchlistGuard</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body><main class="shell"><section class="panel" style="max-width:480px;margin:10vh auto"><p class="eyebrow">WATCHLISTGUARD · SYNTHETIC DEMO</p><h1>Sign in</h1>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button button-primary" type="submit">Sign in</button></form></section></main></body></html>
